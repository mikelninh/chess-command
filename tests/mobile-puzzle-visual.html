<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#111}#result{position:fixed;z-index:9;left:0;top:0;font:10px monospace;background:#fff;color:#000;max-width:100%;white-space:pre-wrap}</style></head><body data-result="WAIT"><iframe id="app" src="../index.html?visual-test=1"></iframe><pre id="result">WAIT</pre><script>
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function waitFor(fn,ms=7000){const end=Date.now()+ms;while(Date.now()<end){try{const v=fn();if(v)return v}catch{}await sleep(80)}throw new Error('timeout')}
async function run(){const frame=document.getElementById('app');const d=frame.contentDocument,w=frame.contentWindow;await waitFor(()=>d.querySelector('[data-go="puzzles"]'));d.querySelector('[data-go="puzzles"]').click();await waitFor(()=>d.body.classList.contains('puzzle-screen-active')&&d.getElementById('puzzleMobileHud')&&d.getElementById('v12PuzzleBoard')?.children.length===64);await sleep(300);const board=d.getElementById('v12PuzzleBoard').getBoundingClientRect(),coach=d.querySelector('.v12-coach').getBoundingClientRect(),hud=d.getElementById('puzzleMobileHud').getBoundingClientRect(),nav=d.querySelector('.topbar nav').getBoundingClientRect(),top=d.querySelector('.topbar').getBoundingClientRect(),main=d.querySelector('main').getBoundingClientRect();const hiddenModes=getComputedStyle(d.getElementById('v18Modes')).display==='none',hiddenThemes=getComputedStyle(d.querySelector('.v12-themes')).display==='none';const files=[...d.querySelectorAll('#v12PuzzleBoard .coord.file')].map(x=>x.textContent).join('');const ranks=[...d.querySelectorAll('#v12PuzzleBoard .coord.rank')].map(x=>x.textContent).join('');const fail=[];if(board.width<250)fail.push('board too small '+board.width);if(board.left<-1||board.right>w.innerWidth+1)fail.push('board horizontal overflow');if(board.bottom>coach.top+2)fail.push('board overlaps coach');if(coach.bottom>nav.top-2)fail.push('coach hidden by bottom nav '+coach.bottom+'>'+nav.top);if(hud.top<top.bottom-3)fail.push('HUD overlaps top bar');if(hud.bottom>board.top+2)fail.push('HUD overlaps board');if(main.bottom>nav.top+2)fail.push('main extends under nav');if(!hiddenModes||!hiddenThemes)fail.push('desktop puzzle controls still consume mobile space');if(files!=='abcdefgh')fail.push('file orientation '+files);if(ranks!=='87654321')fail.push('rank orientation '+ranks);const metrics={viewport:[w.innerWidth,w.innerHeight],top:[top.top,top.bottom],hud:[hud.top,hud.bottom],board:[board.left,board.top,board.width,board.bottom],coach:[coach.top,coach.bottom],nav:[nav.top,nav.bottom],files,ranks};document.body.dataset.result=fail.length?'FAIL':'PASS';document.getElementById('result').textContent=(fail.length?'FAIL '+fail.join(' | '):'PASS')+'\n'+JSON.stringify(metrics);}
window.addEventListener('load',()=>setTimeout(()=>run().catch(e=>{document.body.dataset.result='FAIL';document.getElementById('result').textContent='FAIL '+e.stack}),500));
</script></body></html>
