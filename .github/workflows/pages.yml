name: Chess Command CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mobile browser test dependency
        run: python -m pip install --disable-pip-version-check --quiet 'selenium>=4.20,<5'
      - name: Chess Command release checks
        run: npm run release:check
      - name: Keep rendered mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-visual-screenshots
          path: /tmp/chess-command-*.png
          if-no-files-found: ignore
          retention-days: 7
